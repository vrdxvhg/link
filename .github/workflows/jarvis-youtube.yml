name: JARVIS YouTube Automation

on:
  push:
    paths:
      - 'youtube-automation/**'
      - '.github/workflows/jarvis-youtube.yml'
  pull_request:
    paths:
      - 'youtube-automation/**'
      - '.github/workflows/jarvis-youtube.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'flask>=3.0,<4' 'pytest>=8,<9'
      - name: Compile project
        run: python -m compileall youtube-automation
      - name: Run core state tests
        working-directory: youtube-automation/core
        run: |
          python voice_control_test.py
          python runtime_test.py
          python speech_listener_test.py
          python ui_runtime_test.py
          python runtime_cli.py "I am Vikas" "lock" "I am Vikas"
      - name: Run media pipeline tests
        working-directory: youtube-automation/core
        run: |
          python shorts_media_adapters_test.py
          python render_engine_test.py
      - name: Run bridge UI contract tests
        working-directory: youtube-automation
        run: python -m pytest -q bridge/ui_route_test.py
      - name: Run bridge import smoke test
        working-directory: youtube-automation
        run: python -c "from bridge.app import app; assert app is not None; print('bridge import: OK')"
